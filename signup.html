<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Inner Circle - Exclusive Member Access</title>
    <meta name="description"
        content="Join the Inner Circle to access exclusive member benefits and premium fashion collections">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <!-- Left Panel - Image -->
        <div class="left-panel">
            <div class="image-wrapper">
                <img src="fashion-portrait.jpg" alt="Modern woman in white tailored blazer" class="hero-image">
                <div class="image-overlay"></div>
            </div>
        </div>

        <!-- Right Panel - Signup Form -->
        <div class="right-panel">
            <div class="form-container">
                <a href="index.html" class="back-link">
                    <span class="material-icons">arrow_back</span>
                    <span>Back to Home</span>
                </a>
                <div class="header-section">
                    <h1 class="headline" style="font-style: italic;">Join the Inner Circle</h1>
                    <p class="subheadline">Unlock exclusive access to new drops, sales, and member-only events.</p>
                </div>

                <form class="login-form" id="signupForm">
                    <div class="form-group">
                        <label for="name" class="input-label">FULL NAME</label>
                        <input type="text" id="name" name="name" placeholder="ALEX JOHNSON" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="input-label">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="email@gmail.com" required
                            autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password" class="input-label">PASSWORD</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required
                                autocomplete="new-password">
                            <button type="button" class="toggle-password" id="togglePassword"
                                aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle class="eye-pupil" cx="12" cy="12" r="3"></circle>
                                    <line class="eye-off-line" x1="1" y1="1" x2="23" y2="23" style="display: none;">
                                    </line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn"
                        style="display: flex; justify-items: center; justify-content: center; align-items: center;">
                        <span>BECOME A MEMBER</span>
                    </button>
                </form>

                <div class="footer-section">
                    <p class="signup-text">
                        Already a member?
                        <a href="login.html" class="signup-link">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>

</html>
